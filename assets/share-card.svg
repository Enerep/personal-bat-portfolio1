<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Bat-Ochir — Portfolio</title>
  <desc id="description">Glowing multicolour BAT lettering. Software builder. AI enthusiast. Options trader.</desc>
  <defs>
    <linearGradient id="letter-colour" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#c99afa"/>
      <stop offset=".22" stop-color="#ffa3bb"/>
      <stop offset=".43" stop-color="#ffd0a0"/>
      <stop offset=".64" stop-color="#b0e5df"/>
      <stop offset=".82" stop-color="#8eabff"/>
      <stop offset="1" stop-color="#c99afa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="wide-blur"/>
      <feFlood flood-color="#b284dc" flood-opacity=".28" result="wide-colour"/>
      <feComposite in="wide-colour" in2="wide-blur" operator="in" result="wide-glow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="close-blur"/>
      <feComponentTransfer in="close-blur" result="close-glow"><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode in="wide-glow"/><feMergeNode in="close-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#111112"/>
  <text x="64" y="65" fill="#efefeb" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="-1">Bat-Ochir</text>
  <text x="1136" y="63" text-anchor="end" fill="#a3a3a0" font-family="Arial, Helvetica, sans-serif" font-size="16">Portfolio ↗</text>
  <text x="48" y="505" fill="url(#letter-colour)" filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="560" font-weight="700" letter-spacing="-40">BAT</text>
  <text x="64" y="576" fill="#b8b8b5" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="-.35">Software builder. AI enthusiast. Options trader.</text>
</svg>
